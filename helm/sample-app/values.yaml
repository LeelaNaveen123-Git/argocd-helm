# Global Scaling Footprint
replicaCount: 6

# Container Image Registry (AWS ECR Target)
image:
  repository: 565905129126.dkr.ecr.ap-south-1.amazonaws.com/sample-app
  tag: "8"
  pullPolicy: IfNotPresent

# Core Networking Topology
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# AWS Application Load Balancer Routing Specs
ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  targetType: ip
  healthCheckPath: /health
  # --- New Keys Added Below to Stop Argo CD Null Errors ---
  listenPorts: '[{"HTTP":80}]'
  healthCheckPort: traffic-port
  successCodes: "200"

# Compute Limits (Critical for Karpenter to properly spin up extra nodes!)
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
