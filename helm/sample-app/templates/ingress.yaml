apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sample-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | default "internet-facing" }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType | default "ip" }}
    alb.ingress.kubernetes.io/listen-ports: {{ .Values.ingress.listenPorts | default "[{\"HTTP\":80}]" | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheckPath | default "/health" }}
    alb.ingress.kubernetes.io/healthcheck-port: {{ .Values.ingress.healthCheckPort | default "traffic-port" | quote }}
    alb.ingress.kubernetes.io/success-codes: {{ .Values.ingress.successCodes | default "200" | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "alb" }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sample-app.fullname" . }}
                port:
                  number: {{ .Values.service.port | default 80 }}
